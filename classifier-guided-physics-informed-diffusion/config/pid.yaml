seed: 42

data:
  dataset: mirabest_fits
  batch_size: 8
  input_size: 150

model:
  embedding_dim: 256

training:
  epochs: 200
  learning_rate: 0.0001
  label_dropout: 0.29869287822764246
  num_train_timesteps: 1000

  # physics constraint weights
  # lambda_sym: penalises left-right / top-bottom asymmetry in x_0 estimates
  # lambda_neg: penalises sub-zero (unphysical negative flux) pixel values
  lambda_sym: 0.05
  lambda_neg: 0.0

  weight_decay: 0.01
  eval_interval: 10
  eval_num_samples: 64

optimization:
  max_trials: 25
  parameters:
    learning_rate: { min: 0.000001, max: 0.0001, log: true }
    label_dropout: { min: 0.05, max: 0.30 }
    weight_decay: { min: 0.0001, max: 0.1, log: true }
    embedding_dim: { choices: [128, 256, 512] }
    lambda_sym: { min: 0.01, max: 1.0, log: true }
    lambda_neg: { min: 0.1, max: 2.0, log: true }
