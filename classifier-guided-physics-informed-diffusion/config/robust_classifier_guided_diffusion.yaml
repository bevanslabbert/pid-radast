seed: 42

data:
  dataset: mirabest_fits
  batch_size: 8
  input_size: 150

model:
  embedding_dim: 256
  # loads from checkpoints/diffusion by default; override to use a different starting point
  pretrained_checkpoint: checkpoints/diffusion
  # classifier_type: robust_classification (TimeDependentResNet) by default; can be
  # set to 'classification' instead. classifier_checkpoint overrides the default
  # checkpoints/<classifier_type> path if you want to point at a tagged checkpoint.

training:
  epochs: 200
  learning_rate: 0.00005
  label_dropout: 0.29869287822764246
  num_train_timesteps: 1000

  # weight applied to the robust classifier guidance loss term:
  # loss = MSE(noise_pred, noise) + lambda_cls * CE(classifier(x_0_pred), labels)
  lambda_cls: 0.1

  # classifier guidance only applies to samples with t below this threshold.
  # estimate_x0's one-step estimate is only reliable at low t; guiding on it
  # at high t rewards the UNet for ignoring its noisy input (mode collapse).
  cls_guidance_max_t: 200

  guidance_scale: 7.5

  weight_decay: 0.01
  eval_interval: 10
  eval_num_samples: 64

optimization:
  max_trials: 25
  parameters:
    learning_rate: { min: 0.000001, max: 0.0001, log: true }
    weight_decay: { min: 0.00001, max: 0.1, log: true }
    label_dropout: { min: 0.05, max: 0.30 }
    lambda_cls: { min: 0.01, max: 1.0, log: true }
