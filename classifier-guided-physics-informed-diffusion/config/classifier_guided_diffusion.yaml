seed: 42

data:
  dataset: mirabest_fits
  batch_size: 8
  input_size: 150

model:
  embedding_dim: 256
  # loads from checkpoints/diffusion by default; override to use a different starting point
  pretrained_checkpoint: checkpoints/diffusion
  # which classifier architecture guides training: classification (resnet18, no
  # timestep input) or robust_classification (TimeDependentResNet). Defaults to
  # robust_classification if omitted.
  classifier_type: classification
  classifier_checkpoint: checkpoints/classification/scratch

training:
  epochs: 200
  learning_rate: 0.00005
  label_dropout: 0.29869287822764246
  num_train_timesteps: 1000

  # weight applied to the classifier guidance loss term:
  # loss = MSE(noise_pred, noise) + lambda_cls * (1 - p_correct).mean()
  lambda_cls: 0.1

  guidance_scale: 7.5

  weight_decay: 0.01
  eval_interval: 10
  eval_num_samples: 64

optimization:
  max_trials: 25
  parameters:
    learning_rate: { min: 0.000001, max: 0.0001, log: true }
    weight_decay: { min: 0.00001, max: 0.1, log: true }
    label_dropout: { min: 0.05, max: 0.30 }
    lambda_cls: { min: 0.01, max: 1.0, log: true }
